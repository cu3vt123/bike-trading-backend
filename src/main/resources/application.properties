spring.application.name=quydu_be
# Bí mật cục bộ: sao chép application-local.properties.example -> application-local.properties (gitignore).
# Mặc định dev: bật profile local để tự nạp file trên — không cần cấu hình Active profiles trong IDE.
# Production / CI: đặt SPRING_PROFILES_ACTIVE=prod (hoặc profile khác) để ghi đè.
spring.profiles.default=local

server.port=8081

# Local file uploads (relative to working directory — usually project root when running from IntelliJ)
app.upload-dir=uploads
# Full base URL for URLs returned in JSON (FE có thể dùng trực tiếp trong <img src>)
app.public-base-url=http://localhost:8081
app.frontend-base-url=http://localhost:5173

# Khi true: nếu bảng listings rỗng lúc khởi động, DataSeeder tạo 1 tin demo (Trek Emonda…). Đặt false trong application-local.properties nếu đã TRUNCATE và không muốn tin tự xuất hiện lại.
app.seed-demo-listing=true

# CORS — FE Vite (localhost + 127.0.0.1); thêm origin qua app.cors.extra-origins (ngăn cách phẩy)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.cors.extra-origins=

# OpenAPI / Swagger UI (springdoc): http://localhost:8081/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# MySQL — user/password thật đặt trong application-local.properties (profile local); không commit secret
spring.datasource.url=jdbc:mysql://localhost:3306/quydu_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Quanansavi2015
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT — đặt app.jwt-secret trong application-local.properties hoặc biến môi trường APP_JWT_SECRET
app.jwt-secret=dev-only-replace-in-application-local-properties-min-32-chars-xxxxxxxxxxxx
app.jwt-expiration-ms=604800000
# Refresh token (~30d) — POST /api/auth/refresh
app.jwt-refresh-expiration-ms=2592000000

# Multipart upload limits (match frontend hint: max 5MB per image, up to 5 images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# VNPAY — bắt buộc có vnpay.tmnCode + vnpay.hashSecret trong application-local.properties khi chạy sandbox (profile local).
# returnUrl phải khớp PaymentController: GET /payment/vnpay-return (không nằm dưới /api).
vnpay.tmnCode=
vnpay.hashSecret=
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8081/payment/vnpay-return
# Tuỳ chọn: IPN công khai (HTTPS), ví dụ ngrok — VNPAY server gọi về BE
# vnpay.ipnUrl=
# Để trống: mở đầy đủ lựa chọn thanh toán trên cổng VNPAY. Gán NCB (hoặc mã NH khác) chỉ khi muốn đi thẳng một kênh.
vnpay.bankCode=
