spring.application.name=quydu_be

server.port=8081

# Local file uploads (relative to working directory — usually project root when running from IntelliJ)
app.upload-dir=uploads
# Full base URL for URLs returned in JSON (FE có thể dùng trực tiếp trong <img src>)
app.public-base-url=http://localhost:8081

# CORS — FE Vite (localhost + 127.0.0.1)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/quydu_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Quanansavi2015
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt-secret=replace_with_a_long_secure_secret_key_please_change_in_local_env_12345
app.jwt-expiration-ms=604800000
# Refresh token (~30d) — POST /api/auth/refresh
app.jwt-refresh-expiration-ms=2592000000

# Multipart upload limits (match frontend hint: max 5MB per image, up to 5 images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

